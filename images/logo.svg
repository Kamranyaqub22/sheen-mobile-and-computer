<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Phone body -->
  <rect x="12" y="4" width="24" height="40" rx="4" ry="4" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <!-- Screen -->
  <rect x="15" y="10" width="18" height="24" rx="1" fill="currentColor" opacity="0.08"/>
  <!-- Home button -->
  <circle cx="24" cy="40" r="1.8" fill="currentColor" opacity="0.3"/>
  <!-- Wrench -->
  <g transform="translate(24,24) rotate(-45)">
    <path d="M-2,-10 L2,-10 L2,4 L4,6 L4,10 L0,10 L0,6 L-4,6 L-4,10 L-8,10 L-8,6 L-6,4 L-6,-10 Z" fill="currentColor" opacity="0.0"/>
  </g>
  <!-- Gear circle -->
  <circle cx="34" cy="34" r="9" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <circle cx="34" cy="34" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Gear teeth -->
  <line x1="34" y1="24.5" x2="34" y2="27" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="34" y1="41" x2="34" y2="43.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="24.5" y1="34" x2="27" y2="34" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="41" y1="34" x2="43.5" y2="34" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="27.4" y1="27.4" x2="29.2" y2="29.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="38.8" y1="38.8" x2="40.6" y2="40.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="27.4" y1="40.6" x2="29.2" y2="38.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="38.8" y1="29.2" x2="40.6" y2="27.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Wrench overlay on gear -->
  <path d="M30 30 L32 28 Q34 26.5 36 28 L38 30 L36 32 L34 30 Z" fill="currentColor" opacity="0.6"/>
</svg>
